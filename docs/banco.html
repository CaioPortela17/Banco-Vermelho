<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco Vermelho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="banco-body">

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="user">
        <div class="avatar" id="avatarEl">?</div>
        <div>
          <div class="greeting">Olá,</div>
          <div id="nameDisplay" class="name" onclick="editName()" title="Clique para editar">Carregando...</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="Alternar Modo Escuro" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <button class="icon-btn" title="Notificações" onclick="toggleBell()" id="bellBtn">🔔</button>
        <button class="icon-btn" title="Sair" onclick="logout()">🚪</button>
      </div>
    </div>
  </div>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-label">
      Saldo disponível
      <button class="eye" onclick="toggleEye()" id="eyeBtn">👁</button>
    </div>
    <div class="balance" id="balance">R$ 0,00</div>
    <div class="controls">
      <button class="btn-circle minus" onclick="changeBalance(-1)">−</button>
      <div class="steps" id="steps"></div>
      <button class="btn-circle" onclick="changeBalance(1)">+</button>
    </div>
    <button class="zero" onclick="confirmarZerar()">Zerar saldo</button>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <div class="action" onclick="openModal('modalPix')">
      <div class="action-icon">⚡</div>
      <div class="action-label">Pix</div>
    </div>
    <div class="action" onclick="openModal('modalTransferir')">
      <div class="action-icon">↗</div>
      <div class="action-label">Transferir</div>
    </div>
    <div class="action" onclick="openModal('modalPagar')">
      <div class="action-icon">🧾</div>
      <div class="action-label">Pagar</div>
    </div>
    <div class="action" onclick="openModal('modalRecarga')">
      <div class="action-icon">📱</div>
      <div class="action-label">Recarga</div>
    </div>
  </div>

  <!-- Card -->
  <div class="section-title">Meu cartão</div>
  <div class="card-preview">
    <div><div class="card-brand">Vermelho Black</div></div>
    <div>
      <div class="card-number" id="cardNumber">•••• •••• •••• ----</div>
      <div class="card-name" id="cardName">—</div>
    </div>
  </div>

  <!-- Transactions -->
  <div class="section-title">Últimas transações</div>
  <div class="tx-list" id="txList"></div>

</div>

<!-- ── Modais ── -->
<div class="modal-overlay" id="modalPix">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">⚡ Pix</div>
      <button class="modal-close" onclick="closeModal('modalPix')">✕</button>
    </div>
    <div class="modal-field">
      <label>Chave Pix</label>
      <input type="text" id="pixChave" placeholder="CPF, telefone, e-mail ou chave aleatória">
    </div>
    <div class="modal-field">
      <label>Valor (R$)</label>
      <input type="number" id="pixValor" placeholder="0,00" min="0.01" step="0.01">
    </div>
    <button class="modal-btn" onclick="confirmarPix()">Enviar Pix</button>
  </div>
</div>

<div class="modal-overlay" id="modalTransferir">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">↗ Transferência</div>
      <button class="modal-close" onclick="closeModal('modalTransferir')">✕</button>
    </div>
    <div class="modal-field">
      <label>Destinatário</label>
      <input type="text" id="transNome" placeholder="Nome ou número da conta">
    </div>
    <div class="modal-field">
      <label>Valor (R$)</label>
      <inzput type="number" id="transValor" placeholder="0,00" min="0.01" step="0.01">
    </div>
    <button class="modal-btn" onclick="confirmarTransferencia()">Transferir</button>
  </div>
</div>

<div class="modal-overlay" id="modalPagar">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🧾 Pagar conta</div>
      <button class="modal-close" onclick="closeModal('modalPagar')">✕</button>
    </div>
    <div class="modal-field">
      <label>Descrição</label>
      <input type="text" id="pagarDesc" placeholder="Ex: Conta de luz, Aluguel...">
    </div>
    <div class="modal-field">
      <label>Valor (R$)</label>
      <input type="number" id="pagarValor" placeholder="0,00" min="0.01" step="0.01">
    </div>
    <button class="modal-btn" onclick="confirmarPagamento()">Pagar</button>
  </div>
</div>

<div class="modal-overlay" id="modalRecarga">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📱 Recarga</div>
      <button class="modal-close" onclick="closeModal('modalRecarga')">✕</button>
    </div>
    <div class="modal-field">
      <label>Número do celular</label>
      <input type="tel" id="recargaTel" placeholder="(11) 99999-9999">
    </div>
    <div class="modal-field">
      <label>Escolha o valor</label>
    </div>
    <div class="recarga-grid">
      <div class="recarga-opt" onclick="selecionarRecarga(this, 10)">R$ 10</div>
      <div class="recarga-opt" onclick="selecionarRecarga(this, 20)">R$ 20</div>
      <div class="recarga-opt" onclick="selecionarRecarga(this, 30)">R$ 30</div>
      <div class="recarga-opt" onclick="selecionarRecarga(this, 50)">R$ 50</div>
      <div class="recarga-opt" onclick="selecionarRecarga(this, 100)">R$ 100</div>
      <div class="recarga-opt" onclick="selecionarRecarga(this, 150)">R$ 150</div>
    </div>
    <button class="modal-btn" onclick="confirmarRecarga()">Recarregar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──
  let balance = 0;
  let step    = 100;
  let hidden  = false;
  let trocar  = false;
  let recargaValor = 0;
  const STEPS = [10, 50, 100, 500];

  const email  = localStorage.getItem("emailUsuario") || "";
  const txKey  = `transacoes_${email}`;
  const fmt    = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  const defaultTx = [
    { icone:"🛒", titulo:"Mercado União",  data:"Hoje, 14:32", valor:-127.80 },
    { icone:"💼", titulo:"Salário",        data:"Ontem",       valor:4500.00 },
    { icone:"🎵", titulo:"Spotify",        data:"12 jun",      valor:-21.90  },
    { icone:"⚡", titulo:"Pix de Ana",     data:"10 jun",      valor:150.00  },
  ];

  // ── Init ──
  const nomeSalvo   = localStorage.getItem("nomeUsuario");
  const saldoSalvo  = localStorage.getItem("saldoUsuario");

  if (!nomeSalvo) { window.location.href = "index.html"; }

  if (nomeSalvo) {
    document.getElementById("nameDisplay").textContent = nomeSalvo;
    document.getElementById("cardName").textContent    = nomeSalvo.toUpperCase();
    document.getElementById("avatarEl").textContent    = nomeSalvo.charAt(0).toUpperCase();
  }

  if (saldoSalvo) { balance = parseFloat(saldoSalvo) || 0; }

  // ── Cartão Aleatório (Fixo por Usuário) ──
  function initCartao() {
    let ultimosDigitos = localStorage.getItem(`cartao_${email}`);
    if (!ultimosDigitos) {
      ultimosDigitos = Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem(`cartao_${email}`, ultimosDigitos);
    }
    document.getElementById("cardNumber").textContent = `•••• •••• •••• ${ultimosDigitos}`;
  }
  initCartao();

  // ── Dark Mode ──
  function initTheme() {
    const isDark = localStorage.getItem("theme_dark") === "true";
    if (isDark) {
      document.body.classList.add("dark-mode");
      document.getElementById("themeBtn").textContent = "☀️";
    }
  }
  initTheme();

  function toggleTheme() {
    const isDark = document.body.classList.toggle("dark-mode");
    localStorage.setItem("theme_dark", isDark);
    document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
  }

  // ── Balance ──
  function saveBalance() {
    localStorage.setItem("saldoUsuario", String(balance));
    if (email) localStorage.setItem(`saldo_${email}`, String(balance));
  }

  function render() {
    document.getElementById('balance').textContent = hidden ? 'R$ ••••••' : fmt(balance);
    const stepsEl = document.getElementById('steps');
    stepsEl.innerHTML = '';
    STEPS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'step' + (s === step ? ' active' : '');
      b.textContent = '+' + s;
      b.onclick = () => { step = s; render(); };
      stepsEl.appendChild(b);
    });
  }

  function changeBalance(dir) {
    balance = Math.max(0, balance + dir * step);
    saveBalance();
    render();
  }

  function confirmarZerar() {
    if (balance === 0) return;
    if (confirm("Tem certeza que deseja zerar o saldo?")) {
      balance = 0;
      saveBalance();
      render();
      showToast("Saldo zerado");
    }
  }

  function toggleEye() {
    hidden = !hidden;
    document.getElementById('eyeBtn').textContent = hidden ? '🙈' : '👁';
    render();
  }

  function toggleBell() {
    trocar = !trocar;
    document.getElementById('bellBtn').textContent = trocar ? '🔕' : '🔔';
  }

  // ── Name editing ──
  function editName() {
    const el = document.getElementById('nameDisplay');
    const current = el.textContent;
    const input = document.createElement('input');
    input.className = 'name-input';
    input.value = current;
    el.replaceWith(input);
    input.focus();
    input.select();
    const save = () => {
      const newName = input.value.trim() || current;
      const span = document.createElement('div');
      span.id = 'nameDisplay';
      span.className = 'name';
      span.textContent = newName;
      span.onclick = editName;
      span.title = 'Clique para editar';
      input.replaceWith(span);
      document.getElementById('cardName').textContent   = newName.toUpperCase();
      document.getElementById('avatarEl').textContent   = newName.charAt(0).toUpperCase();
      localStorage.setItem("nomeUsuario", newName);
      showToast("Nome atualizado");
    };
    input.onblur = save;
    input.onkeydown = e => {
      if (e.key === "Enter")  input.blur();
      if (e.key === "Escape") { input.value = current; input.blur(); }
    };
  }

  // ── Logout ──
  function logout() {
    if (confirm("Deseja sair da sua conta?")) {
      ["nomeUsuario","emailUsuario","saldoUsuario"].forEach(k => localStorage.removeItem(k));
      window.location.href = "index.html";
    }
  }

  // ── Transactions ──
  function getTx() {
    const saved = localStorage.getItem(txKey);
    return saved ? JSON.parse(saved) : [...defaultTx];
  }

  function addTx(tx) {
    const saved = localStorage.getItem(txKey);
    const list  = saved ? JSON.parse(saved) : [];
    list.unshift(tx);
    localStorage.setItem(txKey, JSON.stringify(list));
    renderTx();
  }

  function agora() {
    const d = new Date();
    return `Hoje, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function renderTx() {
    const txs = getTx();
    const list = document.getElementById("txList");
    if (!txs.length) {
      list.innerHTML = '<p class="tx-empty">Nenhuma transação ainda.</p>';
      return;
    }
    list.innerHTML = txs.map(tx => {
      const isIn  = tx.valor > 0;
      const fmtV  = Math.abs(tx.valor).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
      return `
        <div class="tx">
          <div class="tx-left">
            <div class="tx-icon">${tx.icone}</div>
            <div>
              <div class="tx-title">${tx.titulo}</div>
              <div class="tx-date">${tx.data}</div>
            </div>
          </div>
          <div class="tx-value ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'} ${fmtV}</div>
        </div>`;
    }).join('');
  }

  // ── Modals ──
  function openModal(id) {
    document.getElementById(id).classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
    document.querySelectorAll(`#${id} input`).forEach(i => i.value = '');
    document.querySelectorAll(`#${id} .recarga-opt`).forEach(o => o.classList.remove('selected'));
    recargaValor = 0;
  }

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
  });

  // ── Actions ──
  function validarValor(val) {
    if (!val || isNaN(val) || val <= 0) { showToast("Informe um valor válido"); return false; }
    if (val > balance)                  { showToast("Saldo insuficiente");       return false; }
    return true;
  }

  function confirmarPix() {
    const chave = document.getElementById('pixChave').value.trim();
    const valor = parseFloat(document.getElementById('pixValor').value);
    if (!chave)               { showToast("Informe a chave Pix"); return; }
    if (!validarValor(valor)) return;
    balance -= valor; saveBalance(); render();
    addTx({ icone:"⚡", titulo:`Pix para ${chave}`, data:agora(), valor:-valor });
    closeModal('modalPix');
    showToast(`Pix de ${fmt(valor)} enviado!`);
  }

  function confirmarTransferencia() {
    const nome  = document.getElementById('transNome').value.trim();
    const valor = parseFloat(document.getElementById('transValor').value);
    if (!nome)                { showToast("Informe o destinatário"); return; }
    if (!validarValor(valor)) return;
    balance -= valor; saveBalance(); render();
    addTx({ icone:"↗", titulo:`Transferência para ${nome}`, data:agora(), valor:-valor });
    closeModal('modalTransferir');
    showToast(`Transferência de ${fmt(valor)} realizada!`);
  }

  function confirmarPagamento() {
    const desc  = document.getElementById('pagarDesc').value.trim();
    const valor = parseFloat(document.getElementById('pagarValor').value);
    if (!desc)                { showToast("Informe a descrição"); return; }
    if (!validarValor(valor)) return;
    balance -= valor; saveBalance(); render();
    addTx({ icone:"🧾", titulo:desc, data:agora(), valor:-valor });
    closeModal('modalPagar');
    showToast(`Pagamento de ${fmt(valor)} realizado!`);
  }

  function selecionarRecarga(el, valor) {
    document.querySelectorAll('.recarga-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    recargaValor = valor;
  }

  function confirmarRecarga() {
    const tel = document.getElementById('recargaTel').value.trim();
    if (!tel)          { showToast("Informe o número do celular"); return; }
    if (!recargaValor) { showToast("Selecione o valor da recarga"); return; }
    if (recargaValor > balance) { showToast("Saldo insuficiente"); return; }
    balance -= recargaValor; saveBalance(); render();
    addTx({ icone:"📱", titulo:`Recarga ${tel}`, data:agora(), valor:-recargaValor });
    closeModal('modalRecarga');
    showToast(`Recarga de ${fmt(recargaValor)} realizada!`);
  }

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Start ──
  render();
  renderTx();
</script>
</body>
</html>
