<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banco Vermelho</title>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:#f5f5f5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 0;
}

.app{
  width:100%;
  max-width:420px;
  background:#ffffff;
  min-height:100vh;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.header{
  background:#ffffff;
  color:#111;
  padding:28px 20px 30px;
  border-bottom:1px solid #ececec;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#c8102e;
  color:#fff;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.greeting{
  font-size:12px;
  color:#777;
}

.name{
  font-size:17px;
  font-weight:600;
  color:#111;
  cursor:pointer;
}

.name:hover{
  color:#c8102e;
}

.name-input{
  background:transparent;
  border:none;
  border-bottom:2px solid #c8102e;
  color:#111;
  font-size:16px;
  font-weight:600;
  outline:none;
  width:180px;
}

.bell{
  background:#fff0f2;
  border:none;
  color:#c8102e;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.balance-card{
  background:#ffffff;
  margin:20px;
  border-radius:20px;
  padding:24px;
  border:1px solid #ededed;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.balance-label{
  color:#666;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:8px;
}

.eye{
  background:none;
  border:none;
  cursor:pointer;
  color:#c8102e;
  font-size:14px;
}

.balance{
  font-size:34px;
  font-weight:700;
  color:#111;
  margin:14px 0 24px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.btn-circle{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  background:#c8102e;
  color:#fff;
  transition:.15s;
}

.btn-circle:hover{
  opacity:.9;
}

.btn-circle:active{
  transform:scale(.95);
}

.btn-circle.minus{
  background:#fff;
  color:#c8102e;
  border:2px solid #c8102e;
}

.steps{
  display:flex;
  gap:8px;
  flex:1;
  justify-content:center;
  flex-wrap:wrap;
}

.step{
  background:#f8f8f8;
  border:1px solid #e5e5e5;
  color:#555;
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  cursor:pointer;
}

.step.active{
  background:#c8102e;
  color:#fff;
  border-color:#c8102e;
}

.zero{
  width:100%;
  margin-top:18px;
  background:#fff;
  border:1px dashed #c8102e;
  color:#c8102e;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:0 20px 10px;
}

.action{
  background:#fff;
  border:1px solid #ededed;
  border-radius:16px;
  padding:18px 8px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
}

.action:hover{
  background:#fff5f6;
  border-color:#c8102e;
}

.action-icon{
  font-size:24px;
  color:#c8102e;
}

.action-label{
  font-size:12px;
  color:#333;
  margin-top:8px;
}

.section-title{
  padding:26px 20px 12px;
  font-size:15px;
  font-weight:700;
  color:#111;
}

.card-preview{
  margin:0 20px;
  background:#ffffff;
  border:2px solid #c8102e;
  color:#111;
  border-radius:20px;
  padding:24px;
  height:170px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card-brand{
  color:#c8102e;
  font-size:14px;
  font-weight:700;
}

.card-name{
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
}

.card-number{
  font-size:14px;
  letter-spacing:3px;
  color:#666;
}

.tx-list{
  padding:8px 20px 40px;
}

.tx{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0;
  border-bottom:1px solid #f0f0f0;
}

.tx:last-child{
  border-bottom:none;
}

.tx-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.tx-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff0f2;
  color:#c8102e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.tx-title{
  font-size:14px;
  color:#111;
  font-weight:600;
}

.tx-date{
  font-size:12px;
  color:#888;
  margin-top:2px;
}

.tx-value{
  font-size:14px;
  font-weight:700;
}

.tx-value.in{
  color:#198754;
}

.tx-value.out{
  color:#c8102e;
}
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-top">
        <div class="user">
          <div class="avatar">R</div>
          <div>
            <div class="greeting">Olá,</div>
           <div id="nameDisplay" class="name" onclick="editName()">Carregando...</div>
        </div>
        <button class="bell" title="Notificações">🔔</button>
      </div>
    </div>

    <div class="balance-card">
      <div class="balance-label">
        Saldo disponível
        <button class="eye" onclick="toggleEye()" id="eyeBtn">👁</button>
      </div>
      <div class="balance" id="balance">R$ 0,00</div>
      <div class="controls">
        <button class="btn-circle minus" onclick="changeBalance(-1)">−</button>
        <div class="steps" id="steps"></div>
        <button class="btn-circle" onclick="changeBalance(1)">+</button>
      </div>
      <button class="zero" onclick="setZero()">Zerar saldo</button>
    </div>

    <div class="actions">
      <div class="action"><div class="action-icon">⚡</div><div class="action-label">Pix</div></div>
      <div class="action"><div class="action-icon">↗</div><div class="action-label">Transferir</div></div>
      <div class="action"><div class="action-icon">🧾</div><div class="action-label">Pagar</div></div>
      <div class="action"><div class="action-icon">📱</div><div class="action-label">Recarga</div></div>
    </div>

    <div class="section-title">Meu cartão</div>
    <div class="card-preview">
      <div>
        <div class="card-brand">Vermelho Black</div>
      </div>
      <div>
        <div class="card-number">•••• •••• •••• 4827</div>
        <div class="card-name" id="cardName">RAFAEL SOUZA</div>
      </div>
    </div>

    <div class="section-title">Últimas transações</div>
    <div class="tx-list">
      <div class="tx"><div class="tx-left"><div class="tx-icon">🛒</div><div><div class="tx-title">Mercado União</div><div class="tx-date">Hoje, 14:32</div></div></div><div class="tx-value out">- R$ 127,80</div></div>
      <div class="tx"><div class="tx-left"><div class="tx-icon">💼</div><div><div class="tx-title">Salário</div><div class="tx-date">Ontem</div></div></div><div class="tx-value in">+ R$ 4.500,00</div></div>
      <div class="tx"><div class="tx-left"><div class="tx-icon">🎵</div><div><div class="tx-title">Spotify</div><div class="tx-date">12 jun</div></div></div><div class="tx-value out">- R$ 21,90</div></div>
      <div class="tx"><div class="tx-left"><div class="tx-icon">⚡</div><div><div class="tx-title">Pix de Ana</div><div class="tx-date">10 jun</div></div></div><div class="tx-value in">+ R$ 150,00</div></div>
    </div>
  </div>

<script>
  let balance = 0;
  let step = 100;
  let hidden = false;
  const STEPS = [10, 50, 100, 500];

  const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  const nomeSalvo = localStorage.getItem("nomeUsuario");
const saldoSalvo = localStorage.getItem("saldoUsuario");

if (nomeSalvo) {
    document.getElementById("nameDisplay").textContent = nomeSalvo;
    document.getElementById("cardName").textContent = nomeSalvo.toUpperCase();
}

if (saldoSalvo) {
    balance = Number(saldoSalvo);
}

  function render() {
    document.getElementById('balance').textContent = hidden ? 'R$ ••••' : fmt(balance);
    const stepsEl = document.getElementById('steps');
    stepsEl.innerHTML = '';
    STEPS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'step' + (s === step ? ' active' : '');
      b.textContent = '+' + s;
      b.onclick = () => { step = s; render(); };
      stepsEl.appendChild(b);
    });
  }

  function changeBalance(dir) {
    balance = Math.max(0, balance + dir * step);
    render();
  }

  function setZero() { balance = 0; render(); }

  function toggleEye() { hidden = !hidden; render(); }

  function editName() {
    const el = document.getElementById('nameDisplay');
    const current = el.textContent;
    const input = document.createElement('input');
    input.className = 'name-input';
    input.value = current;
    el.replaceWith(input);
    input.focus();
    input.select();
    const save = () => {
      const newName = input.value.trim() || 'Sem nome';
      const span = document.createElement('div');
      span.id = 'nameDisplay';
      span.className = 'name';
      span.textContent = newName;
      span.onclick = editName;
      input.replaceWith(span);
      document.getElementById('cardName').textContent = newName.toUpperCase();
    };
    input.onblur = save;
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
  }

  render();
</script>
</body>
</html>
